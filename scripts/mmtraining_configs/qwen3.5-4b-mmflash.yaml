model:
  target_model_path: "Qwen/Qwen3.5-4B"
  draft_model_config: "configs/qwen3.5-4b-dflash.json"
  target_backend: sglang
  # image+text capture: routes prompt building and server requests through the
  # multimodal ServerInputAdapter. Requires a vision-language target model.
  input_modality: image
  trust_remote_code: true
  # A VL checkpoint nests the text stack under model.language_model.* (the
  # vision tower lives in model.visual.*), so the text-only key does not exist.
  # lm_head_key is unused here because the model ties word embeddings.
  embedding_key: "model.language_model.embed_tokens.weight" # @sicheng: changed "model.embed_tokens.weight"
  torch_dtype: "bfloat16"
data:
  train_data_path: "/local_home1/fengsicheng/specforge/regen_data/qwen35-4B_sharegpt4v_regen_first_turn.jsonl"
  max_length: 3072
  chat_template: "qwen3.5"
  build_dataset_num_proc: 32
  cache_dir: "/local_home1/.cache"
training:
  strategy: "dflash"
  num_epochs: 10
  # max_steps: 10000
  batch_size: 2
  accumulation_steps: 4
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1
  attention_backend: "flex_attention"
  num_anchors: 512
  loss_decay_gamma: 7
  save_interval: 10000
  log_interval: 50
  dist_timeout: 30
  seed: 42
runtime:
  # Keep Mooncake residency far below capacity. Reclamation is only pumped when
  # the consumer materializes a feature, so once the store fills up, puts fail,
  # no refs are published, the consumer stalls, and gc() stops running — the
  # store never recovers. Staying orders of magnitude away from full is what
  # prevents that, not raw capacity (~20 MB/sample, so 32 in flight ~= 0.6 GB).
  in_flight_high_watermark: 32
  in_flight_low_watermark: 24
tracking:
  report_to: "tensorboard"
run_id: "qwen3.5-4b-mmflash"
output_dir: "/local_home1/fengsicheng/specforge/outputs/qwen3.5-4b-mmflash"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1 # @sicheng: same as gpu count
  disaggregated:
    control_dir: "/local_home1/fengsicheng/specforge/outputs/qwen3.5-4b-mmflash/control"
    consumer_state_dir: "/local_home1/fengsicheng/specforge/outputs/qwen3.5-4b-mmflash/consumer-state"
    backend: mooncake
    # managed_local: the CLI supervises Mooncake and the SGLang capture server
    # itself, so nothing has to be started by hand. It derives the server URLs
    # and Mooncake endpoints, which is why none of them may be set here.
    managed_local:
      # trainer (consumer) GPUs — must stay disjoint from the capture server's
      trainer_cuda_visible_devices:
        - "1"
      mooncake:
        protocol: tcp
        # Image prompts are long, so one sample's aux features are ~100 MB
        # (5 layers x 4096 tokens x 2560 hidden x bf16). The 32 GB default fills
        # up, spec-capture put_from starts failing, and the rollout worker dies.
        global_segment_size_bytes: 68719476736  # 64 GB
      capture_servers:
        - port: 30000
          cuda_visible_devices:
            - "7"
          tp_size: 1
          # GPU 2 is shared with other jobs, so size the static pool to the free
          # memory rather than to the whole card.
          mem_fraction_static: 0.30
