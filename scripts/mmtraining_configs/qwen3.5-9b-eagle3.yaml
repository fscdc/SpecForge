model:
  target_model_path: "Qwen/Qwen3.5-9B"
  draft_model_config: "configs/qwen3.5-9b-eagle3.json"
  target_backend: sglang
  # image+text capture: routes prompt building and server requests through the
  # multimodal ServerInputAdapter. Requires a vision-language target model.
  input_modality: image
  trust_remote_code: true
  # A VL checkpoint nests the text stack under model.language_model.* (the
  # vision tower lives in model.visual.*), so the text-only key does not exist.
  # Unlike the 4B, Qwen3.5-9B does NOT tie word embeddings (tie_word_embeddings:
  # false), so lm_head_key is read for real: the consumer's TargetHead loads
  # the checkpoint's top-level lm_head.weight, which is the schema default and
  # is spelled out here.
  embedding_key: "model.language_model.embed_tokens.weight"
  lm_head_key: "lm_head.weight"
  # REQUIRED for EAGLE3 disaggregated (planning.py:172): producer and consumer
  # cannot each derive their own mapping, so they must share this file.
  # Build it once from the 9B regen (a frequency ranking, tokenizer-only):
  #   python scripts/prepare_vocab_mapping.py \
  #       --config scripts/mmtraining_configs/qwen3.5-9b-eagle3.yaml
  # or copy the one built on the HPC.
  vocab_mapping_path: "/local_home2/fengsicheng/specforge/vocab_mapping/qwen3.5-9b-eagle3.pt"
  torch_dtype: "bfloat16"
data:
  # The 9B regen of llava-ov 1M with the boxed prompt, the same corpus the 9B
  # DFlash baseline is configured for (the un-prompted regen was never
  # produced for 9B). Copy it over from the HPC regen_data directory first.
  train_data_path: "/local_home2/fengsicheng/specforge/regen_data/qwen35-9B_llava-ov15-1M-prompted_regen_first_turn.jsonl"
  max_length: 4096
  chat_template: "qwen3.5"
  build_dataset_num_proc: 32
  cache_dir: "/local_home2/fengsicheng/specforge/.cache"
  # image_root stays empty: the regen records already carry absolute paths under
  # .../specforge/data/llava-ov15-1M/.
  # image_max_tokens stays 0 on purpose -- the capture server expands image_data
  # with the checkpoint's own resolution, so a client-side cap desyncs the prompt.
training:
  strategy: "eagle3"
  num_epochs: 6
  # max_steps: 1000 # set for testing, comment out for full training
  batch_size: 1
  learning_rate: 0.0001
  max_grad_norm: 0.5
  ttt_length: 7
  attention_backend: "flex_attention"
  save_interval: 10000
  log_interval: 50
  dist_timeout: 30
  seed: 42

tracking:
  report_to: "tensorboard"
run_id: "qwen3.5-9b-eagle3-llava-ov15-1M-prompted"
output_dir: "/local_home2/fengsicheng/specforge/outputs/qwen3.5-9b-eagle3-llava-ov15-1M-prompted"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 3 # @sicheng: same as the trainer GPU count below; the capture GPU is separate
  disaggregated:
    control_dir: "/local_home2/fengsicheng/specforge/outputs/qwen3.5-9b-eagle3-llava-ov15-1M-prompted/control"
    consumer_state_dir: "/local_home2/fengsicheng/specforge/outputs/qwen3.5-9b-eagle3-llava-ov15-1M-prompted/consumer-state"
    backend: mooncake

    # managed_local: the CLI supervises Mooncake and the SGLang capture server
    # itself, so nothing has to be started by hand. It derives the server URLs
    # and Mooncake endpoints, which is why none of them may be set here.
    managed_local:
      # trainer (consumer) GPUs — must stay disjoint from the capture server's
      trainer_cuda_visible_devices:
        - "1"
        - "2"
        - "3"
      mooncake:
        protocol: tcp
      capture_servers:
        - port: 30000
          cuda_visible_devices:
            - "0"
          tp_size: 1
          # GPU 0 is shared with other jobs, so size the static pool to the free
          # memory rather than to the whole card.
          mem_fraction_static: 0.80
