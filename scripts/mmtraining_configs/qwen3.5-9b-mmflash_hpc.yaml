model:
  target_model_path: "Qwen/Qwen3.5-9B"
  draft_model_config: "configs/qwen3.5-9b-mmflash.json"
  target_backend: sglang
  # image+text capture: routes prompt building and server requests through the
  # multimodal ServerInputAdapter. Requires a vision-language target model.
  input_modality: image
  trust_remote_code: true
  # A VL checkpoint nests the text stack under model.language_model.* (the
  # vision tower lives in model.visual.*), so the text-only key does not exist.
  # Unlike the 4B, Qwen3.5-9B does NOT tie word embeddings (tie_word_embeddings:
  # false), so lm_head_key is read for real; the checkpoint carries a top-level
  # lm_head.weight, which is the schema default and is spelled out here.
  embedding_key: "model.language_model.embed_tokens.weight"
  lm_head_key: "lm_head.weight"
  torch_dtype: "bfloat16"
data:
  train_data_path: "/scratch/Projects/CFP-04/CFP04-CF-054/fengsicheng/specforge/regen_data/qwen35-9B_llava-ov15-1M-prompted_regen_first_turn.jsonl"
  max_length: 4096
  chat_template: "qwen3.5"
  build_dataset_num_proc: 32
  cache_dir: "/scratch/Projects/CFP-04/CFP04-CF-054/fengsicheng/specforge/.cache"
  # Per-token visual-grounding scores written by scripts/score_visual_kl_hpc.sh:
  # KL(with image || without) per token, plus the target's entropy with the
  # image. The scores are TARGET-specific (they come from the 9B's own logits),
  # so the 4B sidecar cannot be reused: run
  #   bash scripts/score_visual_kl_hpc.sh scripts/mmtraining_configs/qwen3.5-9b-mmflash_hpc.yaml
  # first; it reads train_data_path and writes into this directory. Leave empty
  # for g=0 everywhere, i.e. the plain loss_type objective on every row (the
  # no-visual-term ablation).
  visual_score_path: "/scratch/Projects/CFP-04/CFP04-CF-054/fengsicheng/specforge/visual_kl/qwen35-9B-llava-ov15-1M-prompted"
  visual_score_transform: "quantile"   # quantile | saturate | binary | identity
  # g = transform(KL) * exp(-entropy): high only where the image both changes
  # AND settles the target's prediction. false = raw KL rank (ablation).
  visual_score_confidence_gate: true
training:
  strategy: "mmflash"
  # One objective for every token of every row:
  #   w = base * (1 + visual_alpha * g * (1 - p)),  loss = sum(w * ce) / bsz
  # base = "mmflash": prefix confidence prod_{i<=k} ((1-s) p_i + s), the smoothed
  # probability that verification reaches position k (s = mmflash_smoothing).
  # Leave unset for dflash's fixed decay; "dpace" for D-PACE.
  # g = visual grounding from the sidecar (0 on text rows), p = the draft's
  # probability on the token. visual_alpha: 0 is exactly loss_type.
  loss_type: "mmflash"
  # mmflash_smoothing: 0.5
  visual_alpha: 1.0
  num_epochs: 6
  # max_steps: 1000 # set for testing, comment out for full training
  batch_size: 2
  accumulation_steps: 4
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1
  attention_backend: "flex_attention"
  num_anchors: 512
  loss_decay_gamma: 7
  save_interval: 10000
  log_interval: 50
  dist_timeout: 30
  seed: 42

tracking:
  report_to: "tensorboard"
run_id: "qwen3.5-9b-mmflash-llava-ov15-1M-prompted"
output_dir: "/scratch/Projects/CFP-04/CFP04-CF-054/fengsicheng/specforge/outputs/qwen3.5-9b-mmflash-llava-ov15-1M-prompted"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1 # @sicheng: same as gpu count
  disaggregated:
    control_dir: "/scratch/Projects/CFP-04/CFP04-CF-054/fengsicheng/specforge/outputs/qwen3.5-9b-mmflash-llava-ov15-1M-prompted/control"
    consumer_state_dir: "/scratch/Projects/CFP-04/CFP04-CF-054/fengsicheng/specforge/outputs/qwen3.5-9b-mmflash-llava-ov15-1M-prompted/consumer-state"
    backend: mooncake
    # server_urls:
    #   - http://127.0.0.1:30000
    # mooncake_metadata_server: http://127.0.0.1:35880/metadata
    # mooncake_master_server_addr: 127.0.0.1:35551
    # mooncake_protocol: tcp

    # managed_local: the CLI supervises Mooncake and the SGLang capture server
    # itself, so nothing has to be started by hand. It derives the server URLs
    # and Mooncake endpoints, which is why none of them may be set here.
    managed_local:
      # trainer (consumer) GPUs — must stay disjoint from the capture server's
      trainer_cuda_visible_devices:
        - "1"
      mooncake:
        protocol: tcp
      capture_servers:
        - port: 30000
          cuda_visible_devices:
            - "0"
          tp_size: 1
          # GPU 2 is shared with other jobs, so size the static pool to the free
          # memory rather than to the whole card.
          mem_fraction_static: 0.80
